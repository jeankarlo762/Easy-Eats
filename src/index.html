  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--
    Bootstrap Icons, usado por toda a UI (<i class="bi bi-...">).
    Hoje a mesma folha é importada via `@import url(...)` em 42 arquivos .scss
    de componente. Declarar aqui uma vez garante os ícones desde o primeiro
    paint e deixa a dependência explícita; a versão é a mesma (1.10.5) já
    fixada nos componentes, para não baixar duas versões da fonte.
    Limpeza recomendada: remover os 42 @import e manter só este link — ou
    instalar o pacote `bootstrap-icons` e declará-lo em angular.json > styles.
  -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
